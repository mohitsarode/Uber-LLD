[project]
name = "h3-dispatch-engine"
version = "1.0.0"
description = "Enterprise-grade asynchronous H3 spatial indexing and dispatch engine with Redis mesh and TimescaleDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Backend SDE Engineer", email = "dev@example.com" }
]
keywords = ["h3", "geospatial", "redis", "fastapi", "dispatch", "websockets", "timescaledb", "spatial-indexing"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "h3>=4.1.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.23.0",
    "locust>=2.29.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
